<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WMS Warehouse Monitor</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#0f172a;color:#f1f5f9;font-family:'Segoe UI',sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh}
    header{width:100%;background:#1e293b;padding:12px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #334155}
    header h1{font-size:17px;font-weight:700}
    header small{font-size:11px;color:#94a3b8}
    .main{width:100%;max-width:900px;padding:12px;display:flex;flex-direction:column;gap:10px}

    .counters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
    .card{background:#1e293b;border-radius:12px;padding:10px;text-align:center;border:1px solid #334155}
    .card .num{font-size:30px;font-weight:800;line-height:1}
    .card .lbl{font-size:10px;color:#64748b;margin-top:3px;text-transform:uppercase}

    .cam-wrap{position:relative;border-radius:14px;overflow:hidden;background:#000;border:2px solid #334155;width:100%}
    #video{width:100%;display:block;opacity:0;position:absolute;pointer-events:none}
    #canvas{width:100%;display:block}

    .controls{background:#1e293b;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    label{font-size:12px;color:#94a3b8;white-space:nowrap}
    input[type=range]{flex:1;accent-color:#3b82f6}
    .val{font-size:12px;color:#60a5fa;font-weight:700;min-width:32px;text-align:right}

    .btn{padding:9px 14px;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;transition:.2s;flex:1}
    .btn:disabled{opacity:.4;cursor:not-allowed}
    .btn-green{background:#22c55e;color:#fff}
    .btn-red{background:#ef4444;color:#fff}
    .btn-gray{background:#334155;color:#f1f5f9}
    .btn-blue{background:#3b82f6;color:#fff}
    .btn-sm{padding:6px 10px;font-size:11px;flex:unset}

    .status-bar{display:flex;align-items:center;gap:10px;background:#1e293b;border-radius:10px;padding:10px 14px}
    .dot{width:9px;height:9px;border-radius:50%;background:#64748b;flex-shrink:0}
    .dot.ready{background:#22c55e}
    .dot.active{background:#22c55e;animation:pulse 1s infinite}
    .dot.warn{background:#f59e0b}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

    .alert-banner{display:none;background:#7f1d1d;border:1px solid #ef4444;border-radius:10px;padding:12px 16px;font-size:14px;font-weight:700;color:#fca5a5;animation:flash .7s infinite}
    @keyframes flash{0%,100%{opacity:1}50%{opacity:.5}}

    .log-panel{background:#1e293b;border-radius:12px;overflow:hidden}
    .log-hdr{padding:8px 14px;font-size:11px;color:#64748b;text-transform:uppercase;border-bottom:1px solid #334155;display:flex;justify-content:space-between}
    .log-row{display:flex;justify-content:space-between;padding:6px 14px;font-size:11px;border-bottom:1px solid #1a2332;color:#cbd5e1}
    .log-row .t{color:#475569}

    .zone-hint{font-size:11px;color:#94a3b8;text-align:center}

    select{padding:8px 10px;border-radius:8px;background:#0f172a;border:1px solid #334155;color:#f1f5f9;font-size:12px;outline:none}

    @media(max-width:480px){.counters{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>

<header>
  <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
    <rect width="26" height="26" rx="7" fill="#f59e0b"/>
    <rect x="4" y="4" width="8" height="8" rx="2" fill="white" opacity=".9"/>
    <rect x="14" y="4" width="8" height="8" rx="2" fill="white" opacity=".6"/>
    <rect x="4" y="14" width="8" height="8" rx="2" fill="white" opacity=".6"/>
    <rect x="14" y="14" width="8" height="8" rx="2" fill="white" opacity=".9"/>
  </svg>
  <div>
    <h1>WMS Warehouse Monitor</h1>
    <small>Motion Tracking · Works from any distance · No AI required</small>
  </div>
</header>

<div class="main">

  <div class="status-bar">
    <div class="dot" id="dot"></div>
    <span id="statusTxt" style="font-size:13px;color:#94a3b8;flex:1">Press Start Camera</span>
    <span id="fpsTxt" style="font-size:11px;color:#475569"></span>
  </div>

  <div class="alert-banner" id="alertBanner">⚠️ Motion in RESTRICTED ZONE!</div>

  <div class="counters">
    <div class="card"><div class="num" style="color:#22c55e" id="numMoving">0</div><div class="lbl">Moving</div></div>
    <div class="card"><div class="num" style="color:#60a5fa" id="numTotal">0</div><div class="lbl">Tracked</div></div>
    <div class="card"><div class="num" style="color:#f59e0b" id="numPeak">0</div><div class="lbl">Peak</div></div>
    <div class="card"><div class="num" style="color:#a855f7" id="numAlerts">0</div><div class="lbl">Alerts</div></div>
  </div>

  <div class="cam-wrap" id="camWrap">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="canvas"></canvas>
  </div>

  <div class="controls">
    <!-- Camera buttons -->
    <div class="row">
      <select id="camSelect" onchange="changeCam(this.value)" style="flex:1">
        <option value="">📷 Default camera</option>
      </select>
      <button class="btn btn-gray btn-sm" onclick="scanCams()">🔍</button>
      <button class="btn btn-gray btn-sm" onclick="flipCam()">🔄</button>
    </div>
    <div class="row">
      <button class="btn btn-green" id="btnStart" onclick="startCam()">▶ Start</button>
      <button class="btn btn-red"   id="btnStop"  onclick="stopCam()" disabled>⏹ Stop</button>
    </div>

    <!-- Sensitivity -->
    <div class="row">
      <label>Sensitivity</label>
      <input type="range" id="sensitivity" min="5" max="80" value="25" oninput="updateSensitivity(this.value)">
      <span class="val" id="sensVal">25</span>
    </div>
    <!-- Min size -->
    <div class="row">
      <label>Min size</label>
      <input type="range" id="minSize" min="100" max="5000" value="500" oninput="updateMinSize(this.value)">
      <span class="val" id="minSizeVal">500</span>
    </div>
    <!-- Frame delay -->
    <div class="row">
      <label>Frame delay</label>
      <input type="range" id="frameDelay" min="2" max="30" value="8" oninput="FRAME_DELAY=+this.value;frameBuffer=[];document.getElementById('fdVal').textContent=this.value">
      <span class="val" id="fdVal">8</span>
    </div>
    <!-- Trail length -->
    <div class="row">
      <label>Trail</label>
      <input type="range" id="trailLen" min="0" max="60" value="25" oninput="TRAIL_MAX=+this.value;document.getElementById('trailVal').textContent=this.value">
      <span class="val" id="trailVal">25</span>
    </div>
    <!-- Debug toggle -->
    <div class="row">
      <button class="btn btn-gray btn-sm" onclick="showDebug=!showDebug;this.textContent=showDebug?'🔴 Debug ON':'👁 Motion Debug'">👁 Motion Debug</button>
      <span style="font-size:11px;color:#64748b">يلوّن الحركة باللون الأحمر عشان تشوف إيه الـ sensitivity المناسب</span>
    </div>

    <!-- Zone -->
    <div class="row">
      <button class="btn btn-blue btn-sm" onclick="startZone()" id="btnZone">📍 Draw Zone</button>
      <button class="btn btn-gray btn-sm" onclick="clearZone()">✕ Clear Zone</button>
      <div class="zone-hint" id="zoneHint">Tap corners of restricted area on the video</div>
    </div>
  </div>

  <div class="log-panel">
    <div class="log-hdr">
      <span>Motion Log</span>
      <button onclick="clearLog()" style="background:none;border:none;color:#64748b;cursor:pointer;font-size:11px">Clear</button>
    </div>
    <div id="logList" style="max-height:180px;overflow-y:auto"></div>
  </div>

</div>

<script>
// ── Config ─────────────────────────────────────────────────
let MOTION_THRESH = 12;   // pixel difference threshold (lower = more sensitive)
let MIN_PIXELS    = 80;   // min pixels to count as motion region
let TRAIL_MAX     = 25;   // trail length in frames
let FRAME_DELAY   = 8;    // compare with frame N frames ago (key for far distance!)
const CELL        = 8;    // grid cell size — smaller = more detail
const PROC_SCALE  = 0.6;  // process at 60% resolution
const MAX_AGE_MS  = 1500;
const MATCH_DIST  = 0.25;
let   showDebug   = false; // show raw motion mask

const OBJ_COLORS = [
  '#22c55e','#3b82f6','#f59e0b','#a855f7',
  '#06b6d4','#f97316','#ec4899','#84cc16',
];

// ── State ──────────────────────────────────────────────────
let stream      = null;
let animId      = null;
let prevData    = null;
let frameBuffer = [];   // stores past frames for delayed comparison
let tracker     = new Tracker();
let peakCount = 0;
let alertCount= 0;
let facingMode= 'environment';
let selectedCamId = null;
let zoneDrawing   = false;
let zonePoints    = [];
let zoneActive    = false;
let lastAlertTime = 0;
let motionLog     = [];
let frameCount    = 0;
let lastFpsTime   = Date.now();

const video  = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d', {willReadFrequently:true});

// Processing canvas (small, for speed)
const proc   = document.createElement('canvas');
const pCtx   = proc.getContext('2d', {willReadFrequently:true});

// ── Tracker ────────────────────────────────────────────────
function Tracker() {
  this.objects = {};
  this.nextId  = 1;

  this.update = function(boxes) {
    const now = Date.now();
    const usedBoxes = new Set();

    // Match existing objects to new boxes
    Object.values(this.objects).forEach(obj => {
      let bestDist = MATCH_DIST;
      let bestIdx  = -1;
      boxes.forEach((box, i) => {
        if (usedBoxes.has(i)) return;
        const dx = (obj.cx - box.cx);
        const dy = (obj.cy - box.cy);
        const d  = Math.sqrt(dx*dx + dy*dy);
        if (d < bestDist) { bestDist = d; bestIdx = i; }
      });
      if (bestIdx >= 0) {
        const b = boxes[bestIdx];
        obj.box = b;
        obj.cx  = b.cx; obj.cy = b.cy;
        obj.trail.push({x:b.cx, y:b.cy});
        if (obj.trail.length > TRAIL_MAX) obj.trail.shift();
        obj.lastSeen = now; obj.moving = true;
        usedBoxes.add(bestIdx);
      } else {
        obj.moving = false;
      }
    });

    // Remove old
    Object.keys(this.objects).forEach(id => {
      if (now - this.objects[id].lastSeen > MAX_AGE_MS) delete this.objects[id];
    });

    // Add new
    boxes.forEach((b, i) => {
      if (!usedBoxes.has(i)) {
        const id = this.nextId++;
        this.objects[id] = {
          id, box:b, cx:b.cx, cy:b.cy,
          trail:[{x:b.cx,y:b.cy}],
          color: OBJ_COLORS[(id-1) % OBJ_COLORS.length],
          lastSeen: now, moving: true, frames: 1,
        };
      }
    });

    return Object.values(this.objects);
  };

  this.reset = function(){ this.objects={}; this.nextId=1; };
}

// ── Motion detection ────────────────────────────────────────
function detectMotion() {
  const PW = proc.width, PH = proc.height;
  pCtx.drawImage(video, 0, 0, PW, PH);
  const curr = pCtx.getImageData(0, 0, PW, PH).data;

  // Frame buffer: compare with FRAME_DELAY frames ago
  frameBuffer.push(new Uint8ClampedArray(curr));
  if (frameBuffer.length < FRAME_DELAY) return [];
  prevData = frameBuffer.shift();

  // Grid-based motion map
  const GW = Math.ceil(PW/CELL), GH = Math.ceil(PH/CELL);
  const grid = new Uint8Array(GW * GH);

  for (let gy = 0; gy < GH; gy++) {
    for (let gx = 0; gx < GW; gx++) {
      let motionPx = 0, total = 0;
      for (let dy = 0; dy < CELL; dy++) {
        const py = gy*CELL+dy; if (py >= PH) continue;
        for (let dx = 0; dx < CELL; dx++) {
          const px = gx*CELL+dx; if (px >= PW) continue;
          const i = (py*PW+px)*4;
          const d = Math.abs(curr[i]-prevData[i]) + Math.abs(curr[i+1]-prevData[i+1]) + Math.abs(curr[i+2]-prevData[i+2]);
          if (d > MOTION_THRESH) motionPx++;
          total++;
        }
      }
      grid[gy*GW+gx] = motionPx > total*0.18 ? 1 : 0;
    }
  }

  prevData = curr.slice();

  // Connected components on grid
  const visited = new Uint8Array(GW * GH);
  const boxes   = [];
  const scaleX  = canvas.width  / PW;
  const scaleY  = canvas.height / PH;

  for (let gy = 0; gy < GH; gy++) {
    for (let gx = 0; gx < GW; gx++) {
      const idx = gy*GW+gx;
      if (!grid[idx] || visited[idx]) continue;
      // BFS on grid
      const cells = [];
      const q = [idx]; visited[idx] = 1;
      while (q.length) {
        const cur = q.shift(); cells.push(cur);
        const cx = cur%GW, cy = Math.floor(cur/GW);
        [[cx-1,cy],[cx+1,cy],[cx,cy-1],[cx,cy+1],[cx-1,cy-1],[cx+1,cy+1],[cx-1,cy+1],[cx+1,cy-1]].forEach(([nx,ny])=>{
          if (nx>=0&&nx<GW&&ny>=0&&ny<GH) {
            const ni=ny*GW+nx;
            if (grid[ni]&&!visited[ni]){visited[ni]=1;q.push(ni);}
          }
        });
      }
      if (cells.length * CELL * CELL < MIN_PIXELS) continue;

      const gxs = cells.map(c=>c%GW);
      const gys = cells.map(c=>Math.floor(c/GW));
      const x1  = Math.min(...gxs)*CELL * scaleX;
      const y1  = Math.min(...gys)*CELL * scaleY;
      const x2  = (Math.max(...gxs)+1)*CELL * scaleX;
      const y2  = (Math.max(...gys)+1)*CELL * scaleY;
      const pad = 10;
      boxes.push({
        x:x1-pad, y:y1-pad, w:(x2-x1)+pad*2, h:(y2-y1)+pad*2,
        cx: ((x1+x2)/2) / canvas.width,
        cy: ((y1+y2)/2) / canvas.height,
        area: cells.length,
      });
    }
  }
  return boxes;
}

// ── Main loop ──────────────────────────────────────────────
function loop() {
  if (!stream || !video.videoWidth) { animId=requestAnimationFrame(loop); return; }

  // Sync canvas size
  if (canvas.width !== video.videoWidth) {
    canvas.width  = video.videoWidth;
    canvas.height = video.videoHeight;
    proc.width    = Math.round(video.videoWidth  * PROC_SCALE);
    proc.height   = Math.round(video.videoHeight * PROC_SCALE);
    prevData = null;
  }

  // Draw video frame
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  // Motion detection
  const boxes   = detectMotion();

  // Debug: show raw motion mask
  if (showDebug && frameBuffer.length >= FRAME_DELAY) {
    const PW=proc.width, PH=proc.height;
    const imgData = ctx.getImageData(0,0,canvas.width,canvas.height);
    const scX=canvas.width/PW, scY=canvas.height/PH;
    const curr=pCtx.getImageData(0,0,PW,PH).data;
    const prev=frameBuffer[0];
    for(let py=0;py<PH;py++) for(let px=0;px<PW;px++){
      const i=(py*PW+px)*4;
      const d=Math.abs(curr[i]-prev[i])+Math.abs(curr[i+1]-prev[i+1])+Math.abs(curr[i+2]-prev[i+2]);
      if(d>MOTION_THRESH){
        const cx=Math.round(px*scX), cy=Math.round(py*scY);
        const ci=(cy*canvas.width+cx)*4;
        imgData.data[ci]=255;imgData.data[ci+1]=50;imgData.data[ci+2]=50;imgData.data[ci+3]=180;
      }
    }
    ctx.putImageData(imgData,0,0);
  }

  const objects = tracker.update(boxes);

  // Draw zone
  if (zonePoints.length > 0) drawZone();

  // Draw tracked objects
  let movingCount = 0;
  objects.forEach(obj => {
    if (!obj.moving) return;
    movingCount++;
    const {x,y,w,h} = obj.box;
    const color = obj.color;

    // Trail
    if (obj.trail.length > 1) {
      ctx.beginPath();
      ctx.moveTo(obj.trail[0].x * canvas.width, obj.trail[0].y * canvas.height);
      obj.trail.forEach(pt => ctx.lineTo(pt.x*canvas.width, pt.y*canvas.height));
      ctx.strokeStyle = color+'88'; ctx.lineWidth = 2; ctx.setLineDash([4,3]);
      ctx.stroke(); ctx.setLineDash([]);
    }

    // Box
    ctx.strokeStyle = color; ctx.lineWidth = 2.5;
    ctx.strokeRect(x, y, w, h);
    ctx.fillStyle = color+'18';
    ctx.fillRect(x, y, w, h);

    // Label
    const lbl = `#${obj.id}`;
    ctx.fillStyle = color; ctx.fillRect(x, y-24, 36, 24);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 13px Segoe UI';
    ctx.fillText(lbl, x+4, y-8);

    // Zone check
    if (zoneActive && zonePoints.length > 2) {
      const px = x + w/2, py = y + h/2;
      if (pointInPoly(px, py, zonePoints)) {
        ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 3;
        ctx.strokeRect(x-2, y-2, w+4, h+4);
        const now = Date.now();
        if (now - lastAlertTime > 5000) {
          lastAlertTime = now; alertCount++;
          document.getElementById('numAlerts').textContent = alertCount;
          document.getElementById('alertBanner').style.display = 'block';
          setTimeout(()=>document.getElementById('alertBanner').style.display='none', 4000);
          addLog(`🚨 Object #${obj.id} entered RESTRICTED ZONE`);
        }
      }
    }
  });

  // Stats
  if (movingCount > peakCount) {
    peakCount = movingCount;
    document.getElementById('numPeak').textContent = peakCount;
  }
  document.getElementById('numMoving').textContent = movingCount;
  document.getElementById('numTotal').textContent  = objects.length;

  // FPS
  frameCount++;
  const now = Date.now();
  if (now - lastFpsTime >= 1000) {
    document.getElementById('fpsTxt').textContent = frameCount + ' fps';
    frameCount = 0; lastFpsTime = now;
  }

  animId = requestAnimationFrame(loop);
}

// ── Zone drawing ───────────────────────────────────────────
function startZone() {
  zoneDrawing = true; zonePoints = []; zoneActive = false;
  document.getElementById('btnZone').textContent = '📍 Drawing... (tap corners)';
  canvas.style.cursor = 'crosshair';
  canvas.onclick = addZonePoint;
}

function addZonePoint(e) {
  if (!zoneDrawing) return;
  const r = canvas.getBoundingClientRect();
  const scaleX = canvas.width / r.width;
  const scaleY = canvas.height / r.height;
  zonePoints.push({
    x: (e.clientX - r.left) * scaleX,
    y: (e.clientY - r.top)  * scaleY,
  });
  if (zonePoints.length >= 4) {
    zoneDrawing = false; zoneActive = true;
    document.getElementById('btnZone').textContent = '📍 Draw Zone';
    document.getElementById('zoneHint').textContent = `Zone active (${zonePoints.length} points)`;
    canvas.style.cursor = '';
    canvas.onclick = null;
  }
}

function clearZone() {
  zonePoints=[]; zoneActive=false; zoneDrawing=false;
  canvas.onclick=null; canvas.style.cursor='';
  document.getElementById('btnZone').textContent='📍 Draw Zone';
  document.getElementById('zoneHint').textContent='Tap corners of restricted area on the video';
}

function drawZone() {
  if (zonePoints.length < 2) return;
  ctx.beginPath();
  ctx.moveTo(zonePoints[0].x, zonePoints[0].y);
  zonePoints.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));
  ctx.closePath();
  ctx.fillStyle   = 'rgba(239,68,68,.12)';
  ctx.strokeStyle = '#ef4444';
  ctx.lineWidth   = 2;
  ctx.setLineDash([6,4]);
  ctx.fill(); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#ef4444';
  ctx.font = 'bold 12px Segoe UI';
  ctx.fillText('⚠ RESTRICTED', zonePoints[0].x+4, zonePoints[0].y-6);
  zonePoints.forEach(p=>{
    ctx.fillStyle='#ef4444';
    ctx.beginPath(); ctx.arc(p.x,p.y,5,0,Math.PI*2); ctx.fill();
  });
}

function pointInPoly(x, y, pts) {
  let inside = false;
  for (let i=0,j=pts.length-1; i<pts.length; j=i++) {
    const xi=pts[i].x, yi=pts[i].y, xj=pts[j].x, yj=pts[j].y;
    if (((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}

// ── Camera ─────────────────────────────────────────────────
async function scanCams() {
  try { const t=await navigator.mediaDevices.getUserMedia({video:true}); t.getTracks().forEach(t=>t.stop()); } catch(e){}
  const devices = await navigator.mediaDevices.enumerateDevices();
  const cams = devices.filter(d=>d.kind==='videoinput');
  const sel = document.getElementById('camSelect');
  sel.innerHTML = `<option value="">📷 Default</option>`
    + cams.map((c,i)=>`<option value="${c.deviceId}">${c.label||'Camera '+(i+1)}</option>`).join('');
}

function changeCam(id){ selectedCamId=id||null; }

function flipCam(){
  facingMode = facingMode==='user'?'environment':'user';
  selectedCamId=null;
  document.getElementById('camSelect').value='';
  if(stream) startCam();
}

async function startCam() {
  if (stream) stopCam();
  try {
    setDot('warn','Starting camera...');
    const constraints = {
      video: selectedCamId
        ? {deviceId:{exact:selectedCamId},width:{ideal:1920},height:{ideal:1080}}
        : {facingMode, width:{ideal:1920},height:{ideal:1080}},
      audio:false
    };
    stream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = stream; await video.play();
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    proc.width   = Math.round(video.videoWidth  * PROC_SCALE);
    proc.height  = Math.round(video.videoHeight * PROC_SCALE);
    prevData = null;
    tracker.reset(); peakCount = 0;
    document.getElementById('btnStart').disabled = true;
    document.getElementById('btnStop').disabled  = false;
    setDot('active','Detecting motion...');
    animId = requestAnimationFrame(loop);
  } catch(e) { setDot('warn','Camera error: '+e.message); }
}

function stopCam() {
  cancelAnimationFrame(animId);
  stream?.getTracks().forEach(t=>t.stop()); stream=null; prevData=null;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  document.getElementById('btnStart').disabled = false;
  document.getElementById('btnStop').disabled  = true;
  setDot('','Stopped');
}

// ── Controls ───────────────────────────────────────────────
function updateSensitivity(v){
  MOTION_THRESH=+v;
  document.getElementById('sensVal').textContent=v;
  frameBuffer=[]; // reset buffer after change
}
function updateMinSize(v){
  MIN_PIXELS=+v;
  document.getElementById('minSizeVal').textContent=v;
}

// ── Log ────────────────────────────────────────────────────
function addLog(msg){
  motionLog.unshift({msg,time:new Date().toLocaleTimeString()});
  if(motionLog.length>50)motionLog.pop();
  renderLog();
}
function renderLog(){
  const el=document.getElementById('logList');
  if(!motionLog.length){el.innerHTML='<div style="padding:12px;font-size:11px;color:#475569;text-align:center">No events</div>';return;}
  el.innerHTML=motionLog.map(e=>`<div class="log-row"><span>${e.msg}</span><span class="t">${e.time}</span></div>`).join('');
}
function clearLog(){ motionLog=[]; renderLog(); }

// ── Helpers ────────────────────────────────────────────────
function setDot(cls,msg){
  document.getElementById('dot').className='dot '+cls;
  document.getElementById('statusTxt').textContent=msg;
}

renderLog();
</script>
</body>
</html>
